[project]
name = "cloud-incident-responder"
version = "0.1.0"
description = "Autonomous incident responder — CloudWatch alarm background job with agent tools and Forage Slack integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
incident-responder = "incident_responder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
